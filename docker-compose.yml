services:
  # ─── Banco de dados espacial ───────────────────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: brasil_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brasil_dados}
      POSTGRES_USER: ${POSTGRES_USER:-brasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasil_secret}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=64MB
        -c maintenance_work_mem=512MB
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c max_worker_processes=8
        -c jit=on
        -c pg_stat_statements.track=all
        -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brasil} -d ${POSTGRES_DB:-brasil_dados}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Pool de conexões (evita stampede no PostGIS) ─────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: brasil_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-brasil_dados}
      DB_USER: ${POSTGRES_USER:-brasil}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-brasil_secret}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:6432"
    depends_on:
      postgis:
        condition: service_healthy

  # ─── Servidor de Vector Tiles (Rust) ──────────────────────────────────────
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: brasil_martin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-brasil}:${POSTGRES_PASSWORD:-brasil_secret}@postgis:5432/${POSTGRES_DB:-brasil_dados}
      RUST_LOG: martin=info,actix_web=warn
    volumes:
      - ./tileserver/martin_config.yaml:/config.yaml:ro
      - ./tileserver/pmtiles:/pmtiles:ro
    ports:
      - "3000:3000"
    command: ["--config", "/config.yaml"]
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Cache de tiles em memória ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: brasil_redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 4gb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── API de metadados (anos disponíveis por métrica) ─────────────────────
  api:
    image: python:3.11-alpine
    container_name: brasil_api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brasil_dados}
      POSTGRES_USER: ${POSTGRES_USER:-brasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasil_secret}
      POSTGRES_HOST: postgis
      PORT: 8001
    volumes:
      - ./api:/app
    working_dir: /app
    command: ["sh", "-c", "pip install psycopg2-binary -q && python server.py"]
    depends_on:
      postgis:
        condition: service_healthy

  # ─── Proxy / cache HTTP para tiles ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: brasil_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache:/var/cache/nginx
    ports:
      - "80:80"
    depends_on:
      - martin
      - api

  # ─── Orquestrador de pipeline ELT ─────────────────────────────────────────
  dagster_webserver:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: brasil_dagster_web
    restart: unless-stopped
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      POSTGRES_DB: ${POSTGRES_DB:-brasil_dados}
      POSTGRES_USER: ${POSTGRES_USER:-brasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasil_secret}
      POSTGRES_HOST: postgis
      REDIS_URL: redis://redis:6379
    volumes:
      - ./pipeline:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    ports:
      - "3001:3001"
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3001", "-w", "workspace.yaml"]
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  dagster_daemon:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: brasil_dagster_daemon
    restart: unless-stopped
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      POSTGRES_DB: ${POSTGRES_DB:-brasil_dados}
      POSTGRES_USER: ${POSTGRES_USER:-brasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasil_secret}
      POSTGRES_HOST: postgis
      REDIS_URL: redis://redis:6379
    volumes:
      - ./pipeline:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    command: ["dagster-daemon", "run"]
    depends_on:
      postgis:
        condition: service_healthy

  # ─── Observabilidade ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: brasil_prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  grafana:
    image: grafana/grafana:latest
    container_name: brasil_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

  # ─── Frontend de desenvolvimento ──────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: brasil_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_MARTIN_URL: http://localhost:3000
      VITE_API_URL: http://localhost:80

volumes:
  postgis_data:
  redis_data:
  dagster_home:
  prometheus_data:
  grafana_data:
