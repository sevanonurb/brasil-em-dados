[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brasil-dados-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Orquestração
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-postgres>=0.23",

    # Transformações SQL
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",

    # Dados espaciais
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "geobr>=0.2",

    # DataSUS
    "pysus>=0.12",

    # Formatos colunares
    "pyarrow>=15",
    "pandas>=2.2",

    # Banco de dados
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",

    # HTTP / scraping
    "httpx>=0.27",
    "beautifulsoup4>=4.12",

    # Utilidades
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dagster_pipeline*"]
