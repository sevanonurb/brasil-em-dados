worker_processes auto;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=tiles:64m
        max_size=2g
        inactive=24h
        use_temp_path=off;

    server {
        listen 80;

        # Metadata API — sem cache (CORS set by the Python server; nginx must not duplicate it)
        location /api/ {
            proxy_pass         http://brasil_api:8001/;
            proxy_set_header   Host $host;
        }

        # Martin tile server — com cache de 5 minutos para tiles dinâmicos
        location / {
            proxy_pass              http://martin:3000/;
            proxy_cache             tiles;
            proxy_cache_key         "$uri$is_args$args";
            proxy_cache_valid       200 5m;
            proxy_cache_use_stale   error timeout updating;
            proxy_set_header        Host $host;
            add_header              X-Cache-Status $upstream_cache_status;
            add_header              Access-Control-Allow-Origin *;
        }
    }
}
